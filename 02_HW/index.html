<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        /* Dark mode custom styles */
        body {
            background-color: #0b0b0d;
            color: #e6eef3;
        }

        .card {
            background-color: #0f1113;
            color: #e6eef3;
            border: 1px solid #222;
        }

        .btn-outline-info {
            color: #8ec7ff;
            border-color: #234e61;
        }

        .btn-outline-info:hover {
            background-color: #0d4f6a;
            color: #fff;
        }

        .btn-outline-warning {
            color: #ffd166;
            border-color: #5b4b0d;
        }

        .btn-outline-warning:hover {
            background-color: #b38600;
            color: #111;
        }

        input.form-control,
        select.form-select,
        textarea.form-control {
            background-color: #101214;
            color: #e6eef3;
            border: 1px solid #232628;
            box-shadow: none;
        }

        input.form-control::placeholder,
        textarea::placeholder {
            color: #83939a;
        }

        .form-label {
            color: #cfe6ef;
        }

        hr {
            border-top-color: #222;
        }

        #lblRes {
            color: #7fe6c3;
        }

        textarea#output {
            background-color: #071018;
            color: #e6eef3;
        }

        a {
            color: #8ec7ff;
        }

        /* Validation outlines for dark mode */
        input.is-invalid, select.is-invalid, textarea.is-invalid {
            border-color: #dc3545 !important;
            box-shadow: none !important;
        }
        input.is-valid, select.is-valid, textarea.is-valid {
            border-color: #198754 !important;
            box-shadow: none !important;
        }
    </style>
</head>

<body>
    <div class="container py-4">

        <!-- CALCULATOR CARD -->
        <div class="row justify-content-center mb-4">
            <div class="col-12 col-md-10 col-lg-8">

                <div class="card shadow rounded-4 p-4">

                    <!-- TOP BUTTONS -->
                    <div class="row mb-3">
                        <div class="col-6 col-md-4">
                            <button class="btn btn-outline-info w-100" onclick="demoNative()">
                                Native Types
                            </button>
                        </div>

                        <div class="col-6 col-md-4 offset-md-4">
                            <button id="btn2" class="btn btn-outline-warning w-100">
                                Register Click From Code
                            </button>
                        </div>
                    </div>

                    <hr>

                    <!-- CALCULATOR INPUTS -->
                    <div class="row g-3 align-items-center">

                        <div class="col-12 col-md-6 col-lg-4">
                            <input id="txt1" type="text" class="form-control form-control-lg"
                                placeholder="First number" />
                        </div>

                        <div class="col-12 col-md-6 col-lg-4">
                            <input id="txt2" type="text" class="form-control form-control-lg"
                                placeholder="Second number" />
                        </div>

                        <div class="col-12 col-md-6 col-lg-2">
                            <select id="operator" class="form-select form-select-lg">
                                <option value="+">+</option>
                                <option value="-">-</option>
                                <option value="*">*</option>
                                <option value="/">/</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6 col-lg-2 d-grid">
                            <button id="btnCalc" class="btn btn-primary btn-lg">
                                =
                            </button>
                        </div>
                    </div>

                    <hr>

                    <!-- RESULT -->
                    <div class="row mt-2">
                        <div class="col-12">
                            <h5 class="text-muted">Result:</h5>
                            <h3 id="lblRes" class="text-primary"></h3>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- LOGS CARD -->
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <div class="card shadow rounded-4 p-4">
                    <textarea id="output" class="form-control" style="height: 250px" readonly></textarea>
                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>

</html>
