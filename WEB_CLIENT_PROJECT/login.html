<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="hero-section">
        <div class="hero-content">

            <i class="fas fa-sign-in-alt text-primary me-2"></i>
            Login
            </h3>

            <form id="loginForm">
                <div class="mb-3">
                    <input class="form-control" id="username" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <input class="form-control" id="password" type="password" placeholder="Password" required>
                </div>
                <button class="btn btn-primary w-100 mb-3">Login</button>
            </form>

            <p id="error" class="text-danger text-center mb-0"></p>

            <div class="text-center mt-3">
                <small>Don't have an account? <a href="register.html" class="text-primary">Register here</a></small>
            </div>
        </div>
    </div>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
