<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .hero-content {
            text-align: center;
            max-width: 600px;
        }

        .feature-cards {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin-top: 3rem;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s ease;
            min-width: 250px;
        }

        .feature-card:hover {
            transform: translateY(-5px);
        }

        .feature-card i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .feature-card h3 {
            margin-bottom: 1rem;
        }

        .btn-custom {
            margin: 0.5rem;
        }
    </style>
</head>

<body>

    <div class="hero-section">
        <div class="hero-content">
            <h1 class="display-4 fw-bold mb-3">WEB CLIENT PROJECT</h1>
            <p class="lead mb-4">Welcome to the Web Development Course Project</p>

            <div class="mb-4">
                <p class="mb-1"><strong>Name:</strong> Asaf Haberer</p>
                <p class="mb-1"><strong>ID:</strong> 206760381</p>
            </div>

            <div class="feature-cards">
                <div class="feature-card">
                    <i class="fas fa-sign-in-alt text-primary"></i>
                    <h3>Login</h3>
                    <p>Access your account</p>
                    <a class="btn btn-primary btn-custom" href="login.html">Login</a>
                </div>
                <div class="feature-card">
                    <i class="fas fa-user-plus text-success"></i>
                    <h3>Register</h3>
                    <p>Create a new account</p>
                    <a class="btn btn-success btn-custom" href="register.html">Register</a>
                </div>
                <div class="feature-card">
                    <i class="fab fa-github text-dark"></i>
                    <h3>GitHub</h3>
                    <p>View the source code</p>
                    <a class="btn btn-dark btn-custom" href="https://github.com/asaf1203/WebDevCourse_HW"
                        target="_blank">GitHub</a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
