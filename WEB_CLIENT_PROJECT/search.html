<!DOCTYPE html>
<html lang="he">

<head>
    <meta charset="UTF-8">
    <title>Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark"
        style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="container-fluid">
            <!-- Navigation Links -->
            <div class="navbar-nav me-auto">
                <a class="nav-link active" href="search.html">
                    <i class="fas fa-search me-1"></i>Search
                </a>
                <a class="nav-link" href="playlists.html">
                    <i class="fas fa-music me-1"></i>Playlists
                </a>
            </div>

            <!-- User Info -->
            <div class="d-flex align-items-center" id="userInfo">
                <span class="navbar-text me-2" id="userName">Loading...</span>
                <img id="userImg" class="rounded-circle" width="40" height="40" 
                     style="border: 2px solid white; cursor: pointer;" 
                     onclick="showProfilePicture()" title="Click to view larger">
                <button class="btn btn-outline-light ms-2" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-4" style="padding-top: 20px;">

        <!-- SEARCH -->
        <div class="input-group mb-4">
            <input id="query" class="form-control form-control-lg" placeholder="search for songs, artists, albums...">
            <button class="btn btn-primary btn-lg" id="searchBtn">
                <i class="fas fa-search me-2"></i>search
            </button>
            <button class="btn btn-success btn-lg" onclick="openUploadModal()">
                <i class="fas fa-upload me-2"></i>Upload MP3
            </button>
        </div>

        <!-- RESULTS -->
        <div class="row" id="results"></div>

    </div>

    <!-- PLAYER MODAL -->
    <div class="modal fade" id="playerModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-body">
                    <iframe id="player" width="100%" height="400" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- PROFILE PICTURE MODAL -->
    <div class="modal fade" id="profilePictureModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center p-0">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" 
                            data-bs-dismiss="modal" style="z-index: 1;"></button>
                    <img id="profilePictureModalImg" class="rounded-circle" 
                         style="width: 300px; height: 300px; object-fit: cover; border: 4px solid white; box-shadow: 0 0 30px rgba(0,0,0,0.5);">
                </div>
            </div>
        </div>
    </div>

    <!-- ADD TO PLAYLIST MODAL -->
    <div class="modal fade" id="playlistModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add to Playlist</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Select Playlist:</label>
                        <select class="form-select" id="playlistSelect">
                            <option value="">Choose existing playlist...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Or create new playlist:</label>
                        <input type="text" class="form-control" id="newPlaylistName" placeholder="Enter playlist name">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="confirmAddBtn">Add to Playlist</button>
                </div>
            </div>
        </div>
    </div>

    <!-- UPLOAD MP3 MODAL -->
    <div class="modal fade" id="uploadModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Upload MP3 File</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Select MP3 File:</label>
                        <input type="file" class="form-control" id="mp3FileInput" accept=".mp3,audio/mpeg">
                        <small class="text-muted">Max size: 10MB</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Song Title:</label>
                        <input type="text" class="form-control" id="mp3Title" placeholder="Enter song title">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Select Playlist:</label>
                        <select class="form-select" id="uploadPlaylistSelect">
                            <option value="">Choose existing playlist...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Or create new playlist:</label>
                        <input type="text" class="form-control" id="uploadNewPlaylistName" placeholder="Enter playlist name">
                    </div>
                    <div id="uploadProgress" class="progress d-none mb-3">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                    </div>
                    <div id="uploadError" class="alert alert-danger d-none"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="confirmUploadBtn" onclick="uploadMP3()">Upload & Add to Playlist</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SUCCESS TOAST NOTIFICATION -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="successToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="fas fa-check-circle me-2"></i>
                    Song was added successfully! 
                    <a href="playlists.html" class="text-white fw-bold text-decoration-underline">Visit playlist →</a>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="js/search.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
