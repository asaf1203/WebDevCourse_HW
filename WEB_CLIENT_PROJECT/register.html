<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="hero-section">
        <div class="hero-content">

            <i class="fas fa-user-plus text-success me-2"></i>
            Register
            </h3>

            <form id="registerForm">
                <div class="mb-3">
                    <input class="form-control" id="username" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <input class="form-control" id="password" type="password" placeholder="Password" required>
                </div>
                <div class="mb-3">
                    <input class="form-control" id="confirmPassword" type="password" placeholder="Confirm Password"
                        required>
                </div>
                <div class="mb-3">
                    <input class="form-control" id="privateName" placeholder="Private Name" required>
                </div>
                <div class="mb-3">
                    <input class="form-control" id="imageUrl" placeholder="Image URL" required>
                </div>
                <button type="submit" class="btn btn-success w-100 mb-3">Register</button>
            </form>

            <p id="error" class="text-danger text-center mb-0"></p>

            <div class="text-center mt-3">
                <small>Already have an account? <a href="login.html" class="text-primary">Login here</a></small>
            </div>
        </div>
    </div>
    </div>

    <script src="js/register.js"></script>
</body>

</html>
